<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Создать песню — Твой Хит AI</title>

<style>
body {
    margin: 0;
    background: #09090f;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    padding: 20px;
    border-bottom: 1px solid #292936;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #ff3b81;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 50px 20px;
}

.back {
    color: #aaa;
    text-decoration: none;
}

h1 {
    font-size: 42px;
    margin-top: 35px;
}

.subtitle {
    color: #aaa;
    font-size: 18px;
    line-height: 1.5;
}

.box {
    background: #12121a;
    border: 1px solid #292936;
    border-radius: 18px;
    padding: 25px;
    margin-top: 25px;
}

label {
    display: block;
    margin-bottom: 12px;
    font-size: 18px;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 140px;
    background: #09090f;
    color: white;
    border: 1px solid #333341;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 18px;
    border: none;
    border-radius: 14px;
    background: #ff3b81;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 14px;
    background: #171722;
    color: #ccc;
}

</style>
</head>

<body>

<div class="header">

    <div class="logo">
        Твой Хит <span>AI</span>
    </div>

</div>


<div class="container">

    <a href="index.html" class="back">
        ← На главную
    </a>

    <h1>
        Создать песню 🎵
    </h1>

    <p class="subtitle">
        Расскажи, какую песню ты хочешь создать.
    </p>


    <div class="box">

        <label>
            О чём будет песня?
        </label>

        <textarea
            id="idea"
            placeholder="Например: сильная девушка начинает новую жизнь..."
        ></textarea>

        <button onclick="createSong()">
            🎤 Создать песню
        </button>

        <div id="result"></div>

    </div>

</div>


<script>

function createSong() {

    let idea = document.getElementById("idea").value;

    let result = document.getElementById("result");

    if (idea.trim() === "") {

        result.style.display = "block";

        result.innerHTML =
            "✍️ Сначала напиши, о чём должна быть песня.";

        return;
    }

    result.style.display = "block";

    result.innerHTML =
        "✨ Отлично! Идея принята.<br><br>" +
        "Следующим этапом подключим настоящую AI-генерацию.";

}

</script>

</body>
</html>
