<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Твой Хит AI — Вход</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 15% 15%, rgba(255,40,140,.4), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(130,60,255,.4), transparent 30%),
        #080811;
}

.box {
    width: 100%;
    max-width: 430px;
    margin: 20px;
    padding: 30px;
    background: rgba(18,18,29,.95);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 25px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
}

.logo span {
    background: linear-gradient(90deg,#ff3b81,#a66cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    text-align: center;
    color: #9999a8;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #ccc;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.12);
    background: #0c0c15;
    color: white;
    outline: none;
    font-size: 16px;
}

input:focus {
    border-color: #ff3b81;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 17px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(90deg,#ff3b81,#a66cff);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.switch {
    margin-top: 20px;
    text-align: center;
    color: #9999a8;
}

.switch a {
    color: #ff6398;
    cursor: pointer;
}

#message {
    margin-top: 18px;
    text-align: center;
    line-height: 1.5;
}

.success {
    color: #72e6a6;
}

.error {
    color: #ff718d;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        Твой Хит <span>AI</span>
    </div>

    <div class="subtitle">
        Создавай песни с помощью искусственного интеллекта
    </div>

    <div id="registerForm">

        <label>Имя</label>

        <input
            id="name"
            type="text"
            placeholder="Как тебя зовут?"
        >

        <label>Электронная почта</label>

        <input
            id="email"
            type="email"
            placeholder="your@email.com"
        >

        <label>Пароль</label>

        <input
            id="password"
            type="password"
            placeholder="Минимум 6 символов"
        >

        <button onclick="register()">
            ✨ Создать аккаунт
        </button>

        <div class="switch">
            Уже есть аккаунт?
            <a onclick="showLogin()">Войти</a>
        </div>

    </div>


    <div id="loginForm" style="display:none;">

        <label>Электронная почта</label>

        <input
            id="loginEmail"
            type="email"
            placeholder="your@email.com"
        >

        <label>Пароль</label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Введите пароль"
        >

        <button onclick="login()">
            Войти
        </button>

        <div class="switch">
            Нет аккаунта?
            <a onclick="showRegister()">Зарегистрироваться</a>
        </div>

    </div>


    <div id="message"></div>

</div>


<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL ="https://xtzhidllwfteluyxoxva.supabase.co/rest/v1/" ;

const SUPABASE_KEY = "sb_publishable_GUf4hEMO-E7yNdD-BNZFhw_uhgcpRzK";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// РЕГИСТРАЦИЯ
// ==========================================

async function register() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    message.className = "";


    if (!name || !email || !password) {

        message.className = "error";

        message.innerHTML =
            "Заполни все поля.";

        return;
    }


    if (password.length < 6) {

        message.className = "error";

        message.innerHTML =
            "Пароль должен содержать минимум 6 символов.";

        return;
    }


    message.innerHTML =
        "⏳ Создаём аккаунт...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    name: name
                }

            }

        });


    if (error) {

        message.className = "error";

        message.innerHTML =
            "Ошибка: " + error.message;

        return;
    }


    message.className = "success";

    message.innerHTML =
        "🎉 Аккаунт создан! Проверь электронную почту и подтверди регистрацию.";
}


// ==========================================
// ВХОД
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("message");


    message.className = "";


    if (!email || !password) {

        message.className = "error";

        message.innerHTML =
            "Введи электронную почту и пароль.";

        return;
    }


    message.innerHTML =
        "⏳ Выполняем вход...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        message.className = "error";

        message.innerHTML =
            "Ошибка входа: " + error.message;

        return;
    }


    message.className = "success";

    message.innerHTML =
        "✅ Вход выполнен!";

}


// ==========================================
// ПЕРЕКЛЮЧЕНИЕ ФОРМ
// ==========================================

function showLogin() {

    document.getElementById("registerForm").style.display =
        "none";

    document.getElementById("loginForm").style.display =
        "block";

    document.getElementById("message").innerHTML =
        "";

}


function showRegister() {

    document.getElementById("loginForm").style.display =
        "none";

    document.getElementById("registerForm").style.display =
        "block";

    document.getElementById("message").innerHTML =
        "";

}

</script>

</body>
</html>
